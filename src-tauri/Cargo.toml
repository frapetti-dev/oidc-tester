[package]
name = "oidc-tester"
version = "0.2.0"
description = "OAuth2/OIDC flow tester"
authors = ["Federico Rapetti"]
license = "MIT"
repository = "https://git.infinityreply.dev/f.rapetti/oidc-tester"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "oidc_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.2", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting"] }
thiserror = "2.0.21"
keyring-core = "1.0.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
os_info = { version = "3.15.0", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6.5"
