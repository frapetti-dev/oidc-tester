# Shared rule anchors (hidden key, not a job).
.rules:
  main-push: &main-push
    if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  release-tag: &release-tag
    if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

include:
  - component: $CI_SERVER_FQDN/shared/components/appsec/appsec@v1.1.0
  - component: $CI_SERVER_FQDN/shared/components/version-extractor/version-extractor@v1.7.0
    inputs:
      stage: version
      rules:
        - *release-tag
      version_string: $CI_COMMIT_TAG

stages:
  - version
  - test
  - build
  - release

variables:
  PNPM_VERSION: 11.15.1
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  GLAB_IMAGE: registry.gitlab.com/gitlab-org/cli:v1.120.0
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# ---------- templates ----------

.pnpm:
  image: node:24-trixie
  cache:
    - &pnpm-cache
      key:
        files: [pnpm-lock.yaml]
        prefix: pnpm
      paths: [.ci-cache/pnpm-store/]
  before_script:
    - corepack enable pnpm
    - corepack install --global "pnpm@$PNPM_VERSION"
    - pnpm install --frozen-lockfile --store-dir .ci-cache/pnpm-store

.cross-toolchain:
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.ci-cache/cargo
    RUSTUP_HOME: $CI_PROJECT_DIR/.ci-cache/rustup
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.ci-cache/xwin
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends nsis lld llvm clang clang-tools
    - export PATH="$CARGO_HOME/bin:$PATH:$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1)"
    - command -v rustup || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
    - rustup target add "$WINDOWS_TARGET"
    - command -v cargo-xwin || cargo install --locked cargo-xwin
    - for tool in clang-cl lld-link llvm-lib llvm-rc makensis cargo-xwin; do command -v "$tool" || { echo "missing tool $tool"; exit 1; }; done

# ---------- version (tags only) ----------

verify-tag-on-main:
  stage: version
  image: $GLAB_IMAGE
  rules:
    - *release-tag
  variables:
    GIT_DEPTH: '0'
  script:
    - git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" || { echo "Tag $CI_COMMIT_TAG ($CI_COMMIT_SHA) is not on $CI_DEFAULT_BRANCH"; exit 1; }

# ---------- test ----------

check:
  extends: .pnpm
  stage: test
  needs: []
  rules: [*main-push, *release-tag]
  script:
    - pnpm check

lint:
  extends: .pnpm
  stage: test
  needs: []
  rules: [*main-push, *release-tag]
  script:
    - pnpm lint

spec-coverage:
  image: node:24-trixie
  stage: test
  needs: []
  rules: [*main-push, *release-tag]
  script:
    # Same as `pnpm spec:check`; the script only uses node built-ins, so no install is needed.
    - node scripts/spec-coverage.ts

unit-tests:
  extends: .pnpm
  stage: test
  needs: []
  rules: [*main-push, *release-tag]
  script:
    - pnpm exec playwright install --with-deps chromium
    # Shared runners are several times slower than a workstation; the browser tests hit the default timeout.
    - pnpm test:unit --testTimeout=60000

rust-tests:
  image: node:24-trixie
  stage: test
  needs: []
  rules: [*main-push, *release-tag]
  variables: !reference [.cross-toolchain, variables]
  cache:
    - key:
        files: [src-tauri/Cargo.lock]
        prefix: rust-test
      paths:
        - .ci-cache/cargo/
        - .ci-cache/rustup/
        - .ci-cache/xwin/
        - src-tauri/target/
  before_script:
    - !reference [.cross-toolchain, script]
  script:
    # The crate is Windows-only (windows-sys, Credential Manager): compile the tests for the
    # MSVC target, they can't run on a Linux runner. generate_context! needs ../build to exist.
    - mkdir -p build
    - cargo xwin test --manifest-path src-tauri/Cargo.toml --target "$WINDOWS_TARGET" --locked --no-run

# ---------- build ----------

build-installer:
  image: node:24-trixie
  stage: build
  rules: [*main-push, *release-tag]
  needs:
    - job: extract_version
      optional: true
    - job: verify-tag-on-main
      optional: true
    - check
    - lint
    - spec-coverage
    - unit-tests
    - rust-tests
  variables: !reference [.cross-toolchain, variables]
  cache:
    - *pnpm-cache
    - key:
        files: [src-tauri/Cargo.lock]
        prefix: rust-release
      paths:
        - .ci-cache/cargo/
        - .ci-cache/rustup/
        - .ci-cache/xwin/
        - src-tauri/target/
  before_script:
    - !reference [.cross-toolchain, script]
    - !reference [.pnpm, before_script]
  script:
    # The cached target dir may hold installers from earlier versions.
    - rm -rf "src-tauri/target/$WINDOWS_TARGET/release/bundle"
    - |
      set -- --runner cargo-xwin --target "$WINDOWS_TARGET" --bundles nsis
      if [ -n "${VERSION:-}" ]; then set -- "$@" --config "{\"version\":\"$VERSION\"}"; fi
      pnpm tauri build "$@"
    - mkdir -p dist
    - cp src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis/*-setup.exe "dist/oidc-tester_${VERSION:-$CI_COMMIT_SHORT_SHA}_x64-setup.exe"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# ---------- release (tags only) ----------

release:
  image: $GLAB_IMAGE
  stage: release
  rules:
    - *release-tag
  needs:
    - extract_version
    - verify-tag-on-main
    - build-installer
  variables:
    GIT_DEPTH: '0'
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  script:
    - git fetch --tags --force origin
    # Changelog range: previous final (non pre-release) v-tag, or the root commit on the first release.
    - |
      if PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$CI_COMMIT_SHA^" 2>/dev/null); then
        FROM=$(git rev-list -n 1 "$PREV_TAG")
      else
        FROM=$(git rev-list --max-parents=0 "$CI_COMMIT_SHA" | tail -n 1)
      fi
      echo "Changelog range: ${PREV_TAG:-<root commit>} ($FROM)..$CI_COMMIT_SHA"
      glab api "projects/$CI_PROJECT_ID/repository/changelog?version=$VERSION&from=$FROM&to=$CI_COMMIT_SHA" > changelog.json
    - jq -r .notes changelog.json > release-notes.md
    - cat release-notes.md
    - >-
      glab release create "$CI_COMMIT_TAG"
      "dist/oidc-tester_${VERSION}_x64-setup.exe#OIDC Tester ${VERSION} setup (Windows x64)#package"
      --name "OIDC Tester $VERSION"
      --notes-file release-notes.md
      --ref "$CI_COMMIT_SHA"
      --use-package-registry
      --package-name oidc-tester
      -R "$CI_PROJECT_PATH"
